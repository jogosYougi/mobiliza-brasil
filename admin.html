<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Moderação — Mobiliza Brasil</title>
  <meta name="theme-color" content="#0e8f4f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230e8f4f'/%3E%3Cpath d='M50 18c-12 0-22 9-22 21 0 16 22 41 22 41s22-25 22-41c0-12-10-21-22-21zm0 29a8 8 0 110-16 8 8 0 010 16z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="demoBanner" class="demo-banner hidden">
    ⚠️ <b>Modo demonstração</b> — sem login; os dados são do seu navegador. Configure o Supabase em <code>js/config.js</code>.
  </div>

  <header class="topbar">
    <div class="container">
      <a class="logo" href="./">
        <span class="logo-mark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C7.6 2 4 5.4 4 9.6 4 15.5 12 22 12 22s8-6.5 8-12.4C20 5.4 16.4 2 12 2zm0 10.5a3 3 0 110-6 3 3 0 010 6z"/></svg></span>
        Mobiliza Brasil <span class="tag" style="margin-left:4px">Moderação</span>
      </a>
      <div style="display:flex;gap:8px">
        <a class="btn btn-ghost btn-sm" href="./">Ver site</a>
        <button class="btn btn-ghost btn-sm hidden" id="btnLogout">Sair</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- login -->
    <section class="login hidden" id="loginView">
      <div class="panel">
        <h2 style="margin:0 0 4px;letter-spacing:-.02em">Entrar</h2>
        <p style="margin:0 0 18px;color:var(--muted)">Acesso restrito a moderadores.</p>
        <form class="form" id="loginForm">
          <div><label class="lbl" for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div>
          <div><label class="lbl" for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required></div>
          <div class="err hidden" id="loginErr"></div>
          <button class="btn btn-primary" type="submit" id="btnLogin">Entrar</button>
        </form>
      </div>
    </section>

    <!-- painel -->
    <section class="hidden" id="panelView">
      <div class="tabs">
        <button class="on" data-tab="req">Pedidos de exclusão <span class="badge hidden" id="badge">0</span></button>
        <button data-tab="all">Todas as mobilizações</button>
      </div>

      <div id="tabReq">
        <div style="display:flex;gap:14px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
          <label class="check"><input type="checkbox" id="showResolved"> Mostrar já resolvidos</label>
        </div>
        <div id="reqList"></div>
      </div>

      <div id="tabAll" class="hidden">
        <div class="panel table-wrap" style="padding:8px 14px">
          <table class="list">
            <thead><tr><th>Ato</th><th>Local</th><th>Data</th><th>Status</th><th></th></tr></thead>
            <tbody id="allBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <div class="empty hidden" id="denied"><b>Sem permissão</b>Este usuário não é moderador. Adicione-o na tabela <code>admins</code> (veja o README).</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
